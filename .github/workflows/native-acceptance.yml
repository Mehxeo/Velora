name: Native binary acceptance
on:
  push:
    branches: [release/proofpage-beta9-acceptance]
  workflow_dispatch:
    inputs:
      candidate:
        description: Draft release tag containing candidate binaries
        required: true
        default: v3.0.0-beta.9
      platforms:
        description: Native targets to test
        type: choice
        default: all
        options: [all, macs, mac-intel, windows, windows-arm]
      probe_only:
        description: Verify native runners without downloading candidate
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: native-binary-acceptance-${{ inputs.platforms || 'all' }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'mac-intel' && '[{"runner":"macos-15-intel","installer":"arch"}]' || inputs.platforms == 'macs' && '[{"runner":"macos-15-intel","installer":"arch"},{"runner":"macos-15","installer":"arch"}]' || inputs.platforms == 'windows' && '[{"runner":"windows-2025","installer":"arch"},{"runner":"windows-2025","installer":"universal"},{"runner":"windows-11-arm","installer":"arch"},{"runner":"windows-11-arm","installer":"universal"}]' || inputs.platforms == 'windows-arm' && '[{"runner":"windows-11-arm","installer":"arch"},{"runner":"windows-11-arm","installer":"universal"}]' || '[{"runner":"macos-15-intel","installer":"arch"},{"runner":"macos-15","installer":"arch"},{"runner":"windows-2025","installer":"arch"},{"runner":"windows-2025","installer":"universal"},{"runner":"windows-11-arm","installer":"arch"},{"runner":"windows-11-arm","installer":"universal"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record native environment
        shell: bash
        run: node -e 'console.log(JSON.stringify({platform:process.platform,arch:process.arch,release:require("os").release(),cpus:require("os").cpus()[0].model}))'
      - name: Prepare current native transcript UI fixture
        run: node scripts/acceptance/prepare-beta9.cjs
      - name: Install and verify candidate binaries
        if: ${{ !inputs.probe_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          CANDIDATE_TAG: ${{ inputs.candidate || 'v3.0.0-beta.9' }}
          INSTALLER_KIND: ${{ matrix.installer }}
        run: node scripts/acceptance/native.cjs

      - name: Keep native acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta9-native-${{ matrix.runner }}-${{ matrix.installer }}
          path: ${{ runner.temp }}/velora-native-*/evidence/*
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: native
    if: ${{ success() && github.ref == 'refs/heads/release/proofpage-beta9-acceptance' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the qualified beta 9 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const gh=(args)=>execFileSync('gh',args,{encoding:'utf8'});
          const repo='Mehxeo/Velora',tag='v3.0.0-beta.9';
          const latest=JSON.parse(gh(['api','repos/'+repo+'/releases/latest']));
          assert(['v3.0.0-beta.8',tag].includes(latest.tag_name),'A newer release must not be replaced.');
          const releases=JSON.parse(gh(['api','repos/'+repo+'/releases']));
          const release=releases.find(r=>r.tag_name===tag);assert(release,'Candidate release is missing.');
          assert.equal(release.assets.length,31);assert(release.assets.every(a=>a.state==='uploaded'&&a.digest?.startsWith('sha256:')));
          const directory=fs.mkdtempSync(path.join(os.tmpdir(),'beta9-publication-'));
          gh(['release','download',tag,'--repo',repo,'--pattern','ARTIFACTS.json','--dir',directory]);
          const manifest=JSON.parse(fs.readFileSync(path.join(directory,'ARTIFACTS.json'),'utf8'));
          assert.equal(manifest.desktopSourceCommit,'5b068984c305a6266462b2249007be2495a9bfdd');assert.equal(manifest.version,'3.0.0-beta.9');
          for(const artifact of manifest.artifacts){const actual=release.assets.find(a=>a.name===artifact.name);assert(actual);assert.equal(actual.size,artifact.size);assert.equal(actual.digest,'sha256:'+artifact.sha256);}
          const notes=(release.body||'')+'\n\nNative installation, upgrades, saved-data preservation, and Proofpage custom-data checks passed on Apple silicon, Intel Mac, Windows x64 and Windows ARM64. macOS installers are signed and notarized. Windows installers remain unsigned; SmartScreen may ask for confirmation on first run.\n';
          const noteFile=path.join(directory,'release-notes.md');fs.writeFileSync(noteFile,notes);
          gh(['release','edit',tag,'--repo',repo,'--draft=false','--prerelease=false','--latest','--notes-file',noteFile]);
          const published=JSON.parse(gh(['api','repos/'+repo+'/releases/tags/'+tag]));assert.equal(published.draft,false);assert.equal(published.assets.length,31);
          console.log('Published '+published.html_url+' with 31 verified assets.');
          NODE
